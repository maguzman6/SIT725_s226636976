<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIT 725 6.2C</title>
    <meta name="description" content="basic template for SIT 725 6.2C">
    <meta name="author" content="SitePoint">
    <meta property="og:title" content="SIT 725 5.1P">
    <meta property="og:type" content="website">
    <meta property="og:description" content="basic template for SIT 725 6.2C">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom Style Sheet-->
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>
    <main class="main-body">
        <div class="container">
            <div class="row">
                <div class="col s12 center-align">
                    <h1 id="heading">Welcome to SIT 725 6.2C</h1>
                    <p class="flow-text">This is a demo application that helps you to interact with 6.2C books API, now using test over the endpoints</p>
                </div>

                <div class="col s12 center-align">
                    <a class="waves-effect waves-light btn" href="#" onClick="loadBooks()">Load All Books</a>
                </div>

                <div class="col s12 center-align">
                    <input value="" id="bookId" type="text" placeholder="Enter Book ID">
                    <a class="waves-effect waves-light btn" href="#" onClick="searchBookById()">Search Book by ID</a>
                </div>

            </div>

            <div class="row">
                <div class="col s12 center-align">
                    <h2>Results</h2>
                    <div id="results-container"></div>
                </div>
            </div>

            <div class="row">
                <div class="col s12 center-align">
                    <h2>Get your lucky number!</h2>
                    <div id="lucky-number-container">
                        <input value="" id="favNumber" type="number" placeholder="Enter your favorite number">
                        <button class="waves-effect waves-light btn" onclick="getLuckyNumber()">Get Lucky Number</button>
                        <p id="lucky-number-result"></p>
                    </div>
                </div>

            
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/scripts.js"></script>

    <script>
        // On load, fetch all books
        document.addEventListener('DOMContentLoaded', function () {
            loadBooks();
        });
    </script>

</body>

</html>
